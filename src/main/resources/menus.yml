      LISTING:
        NAME: "&6&l{amount}x {item}"
        LORE:
          - "&8Your listing"
          - "{renamed_line}"
          - ""
          - "&6&lPrice:"
          - "&a| &a${price} &7total"
          - "&a| &a${unit_price} &7each"
          - "{durability_line}"
          - "&a| &7{expires} &7remaining"
          - ""
          - "&e▶ Click to manage"
      SELL:
        MATERIAL: EMERALD
        NAME: "&a&lLIST NEW ITEM"
        LORE:
          - "&8Description"
          - ""
          - "&6&lInformation:"
