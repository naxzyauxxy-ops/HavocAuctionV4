    BOOK-PAGE: "&8\"{page}\""
    MAP-HEADER: "&6&lMap Art:"
    MAP-HINT: "&fClick below to hold it and see the art."
    MAP-LINES:
      - "&a| &7Map &f#{id} &8• &7scale &f{scale}"
      - "&a| &7{world} &8• &7locked &f{locked}"
    EMPTY: "&7Nothing else to show for this item."
    ITEMS:
      INFO:
        MATERIAL: SPYGLASS
        NAME: "&6&lPREVIEW"
      CONTENT:
        NAME: "&f{amount}x {item}"
        LORE: [ "&8Inside this container" ]
      VIEW-MAP:
        MATERIAL: FILLED_MAP
        NAME: "&6&lVIEW MAP ART"
        LORE:
          - "&8Description"
          - ""
          - "&6&lInformation:"
          - "&fPuts the map in your off hand"
          - "&ffor a few seconds."
          - "&8It cannot be dropped or kept."
      BACK:
        MATERIAL: ARROW
        NAME: "&c&lCLOSE PREVIEW"
        LORE: [ ]

  MY-LISTINGS:
