      INFO: "i"
      VIEW-MAP: "m"
      BACK: "x"
    BODY:
      - "&8{item}"
      - "{renamed_line}"
      - "{durability_line}"
    LINE: "&a| &f{amount}x {item}"
    ENCHANT-LINE: "&a| &f{enchantment} {level}"
    MORE: "&8...and {count} more stacks"
    BOOK-HEADER: "&6&lSigned Book:"
    BOOK-HEADER-UNSIGNED: "&6&lBook and Quill:"
    BOOK-LINES:
      - "&a| &f{title}"
      - "&a| &7Signed by &f{author}"
      - "&a| &7{generation} &8• &f{pages} pages"
    BOOK-LINES-UNSIGNED:
