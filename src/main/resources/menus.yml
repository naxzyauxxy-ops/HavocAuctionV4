        MATERIAL: OAK_SIGN
        NAME: "&6&lSEARCH"
      CONFIRM:
        MATERIAL: LIME_DYE
        NAME: "&a&lSEARCH"
        LORE: [ "&e▶ Run the search" ]
      CLEAR:
        MATERIAL: RED_DYE
        NAME: "&c&lCLEAR"
        LORE: [ ]
      INPUT:
        MATERIAL: NAME_TAG
        NAME: "&6&lENTER TERM"
        LORE:
          - "&8Current: &f{query}"
          - ""
          - "&e▶ Click, then type in chat"
      BACK:
        MATERIAL: ARROW
        NAME: "&c&lBACK"
        LORE: [ ]

  CONFIRM-PURCHASE:
    TITLE: "&8▷ Auction House &8| &8Confirm Purchase"
    FILL: false
    STRUCTURE:
      - "_ _ _ i _ _ _ _ _"
      - "_ _ v _ p _ x _ _"
      - "_ _ _ _ _ _ _ _ _"
    CHARS:
      CONTENT: "."
      INFO: "i"
      CONFIRM: "v"
      PREVIEW: "p"
      BACK: "x"
    BODY:
      - "&8{seller}"
      - "{renamed_line}"
      - ""
      - "&6&lInformation:"
      - "&fA &f{type}&f, listed for sale."
      - "{durability_line}"
      - ""
      - "&6&lPrice:"
      - "&a| &a${price} &7total"
      - "&a| &a${unit_price} &7each"
      - ""
      - "&6&lYour Balance:"
      - "&a| &a${balance} &7now"
      - "&a| &a${after} &7after"
    ITEMS:
      CONFIRM:
        MATERIAL: LIME_DYE
        NAME: "&a&lCONFIRM BUY"
        LORE: [ "&e▶ Buy for &a${price}" ]
      PREVIEW:
        MATERIAL: SPYGLASS
        NAME: "&6&lINSPECT ITEM"
        LORE: [ "&e▶ Contents, map art, enchants" ]
      BACK:
        MATERIAL: ARROW
        NAME: "&c&lCANCEL"
        LORE: [ ]

  CONTAINER-PREVIEW:
