# =====================================================
#              HavocAuction - menus.yml
# =====================================================
# Menus are drawn as pictures. STRUCTURE is one line per row, one character per slot,
# and CHARS says what each character means.
#
#   "."  content, the repeating area
#   "<"  previous page    ">"  next page
#
# Every other character names a button under ITEMS. There are no filler panes: empty
# slots stay empty, which reads cleaner than a wall of glass.

LINES:
  SEPARATOR: "&8&m                         "
  DURABILITY: "&a| &f{durability} &8({durability_percent}%)"
  RENAMED: "&c| &7Renamed. Actually a &f{type}"
  RENAMED-TAG: " &8({type})"

NAMES:
  SORT:
    RECENTLY-LISTED: "Newest to oldest"
    OLDEST-LISTED: "Oldest to newest"
    LOWEST-PRICE: "Cheapest to priciest"
    HIGHEST-PRICE: "Priciest to cheapest"
    BEST-UNIT-PRICE: "Best price per item"
    ENDING-SOON: "Ending soonest"
  FILTER:
    ALL: "All items"
    BLOCKS: "Blocks"
    TOOLS: "Tools"
    FOOD: "Food"
    COMBAT: "Combat"
    POTIONS: "Potions"
    BOOKS: "Books"
    INGREDIENTS: "Ingredients"
    UTILITIES: "Other"

FILLER:
  MATERIAL: AIR
  NAME: " "

MENUS:

  AUCTION:
    TITLE: "&8▷ Auction House &8| &8({page}/{pages})"
    FILL: false
    HIDDEN: [ FILTER, CLOSE, INFO ]
    STRUCTURE:
      - ". . . . . . . . ."
      - ". . . . . . . . ."
      - ". . . . . . . . ."
      - ". . . . . . . . ."
      - ". . . . . . . . ."
      - "Y o _ < r > s t _"
    CHARS:
      CONTENT: "."
      MY-LISTINGS: "Y"
      SORT: "o"
      PREVIOUS: "<"
      REFRESH: "r"
      NEXT: ">"
      SEARCH: "s"
      TRANSACTIONS: "t"
    EMPTY: "&7Nothing listed right now."
    ITEMS:
      LISTING:
        NAME: "&f{amount}x {item}{renamed_tag}"
        LORE:
          - "&8Description"
          - ""
          - "&6Information:"
          - "&fSold by &e{seller}"
          - "&fPrice: &a${price}"
          - ""
          - "&e▶ &6CLICK &eTo Buy"
      OWN-LISTING:
        NAME: "&f{amount}x {item}{renamed_tag}"
        LORE:
          - "&8Your listing"
          - ""
          - "&6Information:"
          - "&fPrice: &a${price}"
          - "&fEnds in &e{expires}"
          - ""
          - "&e▶ &6CLICK &eTo Manage"
      MY-LISTINGS:
        MATERIAL: BLACK_SHULKER_BOX
        NAME: "&d&lYOUR ITEMS"
        LORE:
          - "&8Description"
          - ""
          - "&cInformation:"
          - "&fClick to view the"
          - "&fitems you have listed!"
          - ""
          - "&e▶ &6CLICK &eTo View"
      SORT:
        MATERIAL: HOPPER
        NAME: "&6&lAUCTION SORTING"
        SELECTED-FORMAT: "&c| &a▶ {option}"
        UNSELECTED-FORMAT: "&c| &7▶ {option}"
        LORE:
          - "&8Description"
          - ""
          - "&6Information:"
          - "&fChange how items are sorted"
          - "&fon the auction house boards"
          - ""
          - "&6Current Selection:"
          - "{sort_options}"
          - ""
          - "&e▶ &6CLICK &eTo Change"
      PREVIOUS:
        MATERIAL: ARROW
        NAME: "&c&lPREVIOUS PAGE"
        LORE:
          - "&8Description"
          - ""
          - "&cInformation:"
          - "&fClick here to navigate"
          - "&fto the previous page!"
          - ""
          - "&e▶ &6CLICK &eTo Navigate"
      REFRESH:
        MATERIAL: ENDER_EYE
        NAME: "&a&lAUCTION"
        LORE:
          - "&8Description"
          - ""
          - "&aInformation:"
          - "&fClick here to"
          - "&frefresh the auction gui"
          - ""
          - "&e▶ &6CLICK &eTo Refresh"
      NEXT:
        MATERIAL: ARROW
        NAME: "&a&lNEXT PAGE"
        LORE:
          - "&8Description"
          - ""
          - "&aInformation:"
          - "&fClick here to navigate"
          - "&fto the next page!"
          - ""
          - "&e▶ &6CLICK &eTo Navigate"
      SEARCH:
        MATERIAL: OAK_SIGN
        NAME: "&a&lSEARCH"
        LORE:
          - "&8Description"
          - ""
          - "&aInformation:"
          - "&fClick here to"
          - "&fsearch any item"
          - ""
          - "&e▶ &6CLICK &eTo Search"
      TRANSACTIONS:
        MATERIAL: WRITABLE_BOOK
        NAME: "&b&lTRANSACTIONS"
        LORE:
          - "&8Description"
          - ""
          - "&bInformation:"
          - "&fClick to view your"
          - "&fauction history!"
          - ""
          - "&e▶ &6CLICK &eTo View"

  CONFIRM-PURCHASE:
    TITLE: "&8▷ Auction House &8| &8Confirm Gui"
    FILL: false
    HIDDEN: [ INFO ]
    STRUCTURE:
      - "_ _ _ _ _ _ _ _ _"
      - "_ _ x _ i _ v _ _"
      - "_ _ _ _ p _ _ _ _"
    CHARS:
      CONTENT: "."
      INFO: "i"
      CONFIRM: "v"
      PREVIEW: "p"
      BACK: "x"
    BODY:
      - "&8Description"
      - ""
      - "&6Information:"
      - "&fSold by &e{seller}"
      - "&fPrice: &a${price}"
      - "&fYour balance after: &a${after}"
    ITEMS:
      CONFIRM:
        MATERIAL: LIME_STAINED_GLASS_PANE
        NAME: "&a&lCONFIRM BUY"
        LORE:
          - "&8Description"
          - ""
          - "&aInformation:"
          - "&fBuy this for &a${price}"
          - ""
          - "&e▶ &6CLICK &eTo Buy"
      PREVIEW:
        MATERIAL: SPYGLASS
        NAME: "&e&lVIEW MAP ART"
        LORE:
          - "&8Description"
          - ""
          - "&6Information:"
          - "&fHolds the map for a few seconds"
          - "&fso you can see the art"
          - ""
          - "&e▶ &6CLICK &eTo View"
      BACK:
        MATERIAL: RED_STAINED_GLASS_PANE
        NAME: "&c&lCANCEL"
        LORE:
          - "&8Description"
          - ""
          - "&cInformation:"
          - "&fGo back without buying"
          - ""
          - "&e▶ &6CLICK &eTo Cancel"

  MY-LISTINGS:
    TITLE: "&8▷ Auction House &8| &8Your Items"
    FILL: false
    HIDDEN: [ ALERTS, FAST-BUY, INFO ]
    STRUCTURE:
      - "_ _ _ _ _ _ _ _ _"
      - "_ . _ . _ . _ . _"
      - "_ _ _ _ _ _ _ _ _"
      - "< e _ g _ t _ x >"
    CHARS:
      CONTENT: "."
      PREVIOUS: "<"
      NEXT: ">"
      SELL: "e"
      COLLECT: "g"
      TRANSACTIONS: "t"
      BACK: "x"
    EMPTY: "&7You have nothing listed."
    ITEMS:
      LISTING:
        NAME: "&f{amount}x {item}{renamed_tag}"
        LORE:
          - "&8Your listing"
          - ""
          - "&6Information:"
          - "&fPrice: &a${price}"
          - "&fEnds in &e{expires}"
          - ""
          - "&e▶ &6CLICK &eTo Manage"
      SELL:
        MATERIAL: EMERALD
        NAME: "&a&lLIST NEW ITEM"
        LORE:
          - "&8Description"
          - ""
          - "&aInformation:"
          - "&fLists whatever is in your hand"
          - "&fOr use /ah sell <price>"
          - ""
          - "&e▶ &6CLICK &eTo List"
      COLLECT:
        MATERIAL: CHEST_MINECART
        NAME: "&6&lCOLLECT &8({collectable})"
        LORE:
          - "&8Description"
          - ""
          - "&6Information:"
          - "&fItems from listings you pulled"
          - "&for that ran out of time"
          - ""
          - "&e▶ &6CLICK &eTo Collect"
      TRANSACTIONS:
        MATERIAL: WRITABLE_BOOK
        NAME: "&b&lTRANSACTIONS"
        LORE:
          - "&8Description"
          - ""
          - "&bInformation:"
          - "&fClick to view your"
          - "&fauction history!"
          - ""
          - "&e▶ &6CLICK &eTo View"
      PREVIOUS:
        MATERIAL: ARROW
        NAME: "&c&lPREVIOUS PAGE"
        LORE:
          - "&8Description"
          - ""
          - "&cInformation:"
          - "&fClick here to navigate"
          - "&fto the previous page!"
          - ""
          - "&e▶ &6CLICK &eTo Navigate"
      NEXT:
        MATERIAL: ARROW
        NAME: "&a&lNEXT PAGE"
        LORE:
          - "&8Description"
          - ""
          - "&aInformation:"
          - "&fClick here to navigate"
          - "&fto the next page!"
          - ""
          - "&e▶ &6CLICK &eTo Navigate"
      BACK:
        MATERIAL: BARRIER
        NAME: "&c&lBACK"
        LORE:
          - "&8Description"
          - ""
          - "&cInformation:"
          - "&fReturn to the auction house"
          - ""
          - "&e▶ &6CLICK &eTo Go Back"

  MANAGE-LISTING:
    TITLE: "&8▷ Auction House &8| &8Your Listing"
    FILL: false
    STRUCTURE:
      - "_ _ _ i _ _ _ _ _"
      - "_ _ K _ p _ x _ _"
      - "_ _ _ _ _ _ _ _ _"
    CHARS:
      CONTENT: "."
      INFO: "i"
      CANCEL-LISTING: "K"
      PREVIEW: "p"
      BACK: "x"
    BODY:
      - "&8Your listing"
      - "{renamed_line}"
      - ""
      - "&6&lPrice:"
      - "&a| &a${price} &7total"
      - "{durability_line}"
      - "&a| &7{expires} &7remaining"
    ITEMS:
      CANCEL-LISTING:
        MATERIAL: RED_DYE
        NAME: "&c&lREMOVE LISTING"
        LORE:
          - "&8Description"
          - ""
          - "&6&lInformation:"
          - "&fTakes it off the board. The item"
          - "&fwaits in your collect menu."
      PREVIEW:
        MATERIAL: SPYGLASS
        NAME: "&6&lINSPECT ITEM"
        LORE: [ ]
      BACK:
        MATERIAL: ARROW
        NAME: "&c&lBACK"
        LORE: [ ]

  SELL:
    TITLE: "&8▷ Auction House &8| &8List Item"
    FILL: false
    STRUCTURE:
      - "_ _ _ i _ _ _ _ _"
      - "_ _ q _ u _ v _ _"
      - "_ _ _ _ x _ _ _ _"
    CHARS:
      CONTENT: "."
      INFO: "i"
      INPUT: "q"
      PRICE-PER-ITEM: "u"
      CONFIRM: "v"
      BACK: "x"
    BODY:
      - "&8{amount}x {item}"
      - ""
      - "&6&lInformation:"
      - "&fPrice accepts 1k, 2.5m and so on."
      - ""
      - "&6&lCurrent Selection:"
      - "&a| &a${price} &7asking"
      - "&a| &c${fee} &7listing fee"
      - "&a| &a${payout} &7you receive"
      - "&8After ${tax} tax"
    BODY-EMPTY:
      - "&8Nothing in hand"
      - ""
      - "&6&lInformation:"
      - "&fHold the item you want to sell,"
      - "&fthen reopen this menu."
    PRICE-LABEL: "price"
    ITEMS:
      INFO:
        MATERIAL: EMERALD
        NAME: "&6&lLIST ITEM"
      INPUT:
        MATERIAL: NAME_TAG
        NAME: "&6&lSET PRICE"
        LORE: [ "&e▶ Click, then type in chat" ]
      PRICE-PER-ITEM:
        MATERIAL: COMPARATOR
        NAME: "&6&lTREAT AS PER-ITEM"
        LORE: [ "&8Multiplies by the stack size ({amount})" ]
      CONFIRM:
        MATERIAL: LIME_DYE
        NAME: "&a&lLIST IT"
        LORE: [ "&e▶ Publish to the auction" ]
      BACK:
        MATERIAL: ARROW
        NAME: "&c&lBACK"
        LORE: [ ]

  CONFIRM-LISTING:
    TITLE: "&8▷ Auction House &8| &8Confirm Gui"
    FILL: false
    STRUCTURE:
      - "_ _ _ _ _ _ _ _ _"
      - "_ _ x _ i _ v _ _"
      - "_ _ _ _ _ _ _ _ _"
    CHARS:
      CONTENT: "."
      INFO: "i"
      CONFIRM: "v"
      BACK: "x"
    BODY:
      - "&8Are you sure?"
      - ""
      - "&6&lInformation:"
      - "&fListing &f{amount}x {item}"
      - "&ffor &a${price}&f."
      - ""
      - "&6&lCosts:"
      - "&a| &c${fee} &7listing fee"
      - "&a| &a${payout} &7you receive on sale"
    ITEMS:
      CONFIRM:
        MATERIAL: LIME_STAINED_GLASS_PANE
        NAME: "&a&lCONFIRM SALE"
        LORE: [ ]
      BACK:
        MATERIAL: RED_STAINED_GLASS_PANE
        NAME: "&c&lABORT"
        LORE: [ ]

  COLLECT:
    TITLE: "&8▷ Auction House &8| &8Collect"
    FILL: false
    STRUCTURE:
      - ". . . . . . . . ."
      - ". . . . . . . . ."
      - ". . . . . . . . ."
      - ". . . . . . . . ."
      - ". . . . . . . . ."
      - "< C 1 2 i 3 _ x >"
    CHARS:
      CONTENT: "."
      PREVIOUS: "<"
      NEXT: ">"
      COLLECT-ALL: "C"
      DROP-PAGE: "1"
      DROP-PAGES: "2"
      DROP-ALL: "3"
      INFO: "i"
      BACK: "x"
    EMPTY: "&7Nothing waiting for you."
    BODY:
      - "&8Description"
      - ""
      - "&6&lInformation:"
      - "&fItems from listings you pulled,"
      - "&for that ran out of time."
      - ""
      - "&6&lThis Page:"
      - "&a| &f{count} &7listings"
      - "&a| &f{total_items} &7items"
    ITEMS:
      INFO:
        MATERIAL: CHEST_MINECART
        NAME: "&6&lYOUR ITEMS"
      LOOT:
        NAME: "&6&l{amount}x {item}{renamed_tag}"
        LORE:
          - "&8{status} listing"
          - ""
          - "&6&lInformation:"
          - "&fWas listed for &a${price}&f."
          - "{durability_line}"
          - ""
          - "&e▶ Click to collect"
      COLLECT-ALL:
        MATERIAL: CHEST_MINECART
        NAME: "&a&lCOLLECT ALL"
        LORE: [ "&e▶ Takes everything that fits" ]
      DROP-PAGE:
        MATERIAL: HOPPER
        NAME: "&6&lDROP PAGE"
        LORE: [ "&8Drops the {per_page} entries here" ]
      DROP-PAGES:
        MATERIAL: HOPPER
        NAME: "&6&lDROP {pages_batch} PAGES"
        LORE: [ ]
      DROP-ALL:
        MATERIAL: DROPPER
        NAME: "&c&lDROP EVERYTHING &8({total_items})"
        LORE: [ "&cAnyone nearby can pick it up" ]
      PREVIOUS:
        MATERIAL: ARROW
        NAME: "&6&lPREVIOUS PAGE"
        LORE: [ ]
      NEXT:
        MATERIAL: ARROW
        NAME: "&6&lNEXT PAGE"
        LORE: [ ]
      BACK:
        MATERIAL: BARRIER
        NAME: "&c&lBACK"
        LORE: [ ]

  DROP-CONFIRM:
    TITLE: "&8▷ Auction House &8| &8Drop Everything"
    FILL: false
    STRUCTURE:
      - "_ _ _ i _ _ _ _ _"
      - "_ _ v _ _ _ x _ _"
      - "_ _ _ _ _ _ _ _ _"
    CHARS:
      CONTENT: "."
      INFO: "i"
      CONFIRM: "v"
      BACK: "x"
    BODY:
      - "&8Are you sure?"
      - ""
      - "&6&lInformation:"
      - "&fDropping &f{amount} &fitems"
      - "&fon the ground."
      - ""
      - "&cThey are not protected."
    ITEMS:
      INFO:
        MATERIAL: DROPPER
        NAME: "&c&lDROP EVERYTHING"
      CONFIRM:
        MATERIAL: LIME_DYE
        NAME: "&c&lDROP IT ALL"
        LORE: [ ]
      BACK:
        MATERIAL: ARROW
        NAME: "&c&lABORT"
        LORE: [ ]

  TRANSACTIONS:
    TITLE: "&8▷ Transactions &8| &8({page}/{pages})"
    FILL: false
    STRUCTURE:
      - ". . . . . . . . ."
      - ". . . . . . . . ."
      - ". . . . . . . . ."
      - ". . . . . . . . ."
      - ". . . . . . . . ."
      - "< _ _ s i _ _ x >"
    CHARS:
      CONTENT: "."
      PREVIOUS: "<"
      NEXT: ">"
      SEARCH: "s"
      INFO: "i"
      BACK: "x"
    EMPTY: "&7No transactions yet."
    BODY:
      - "&8Description"
      - ""
      - "&6&lStatistics:"
      - "&a| &a${total_made} &7earned"
      - "&a| &c${total_spent} &7spent"
      - "&a| &f${net} &7net"
      - ""
      - "&6&lThis Page:"
      - "&a| &f{sales} &7sales &8• &f{purchases} &7purchases"
      - "&a| &fpage {page}&7/&f{pages}"
    ITEMS:
      INFO:
        MATERIAL: GOLD_INGOT
        NAME: "&6&lSTATISTICS"
      SALE:
        NAME: "&a&l{amount}x {item}"
        LORE:
          - "&8Sale"
          - ""
          - "&6&lInformation:"
          - "&a| &7Sold to &f{buyer}"
          - "&a| &a${price} &7revenue"
          - "&a| &7{time} ago"
      PURCHASE:
        NAME: "&c&l{amount}x {item}"
        LORE:
          - "&8Purchase"
          - ""
          - "&6&lInformation:"
          - "&a| &7Bought from &f{seller}"
          - "&a| &c${price} &7cost"
          - "&a| &7{time} ago"
      SEARCH:
        MATERIAL: OAK_SIGN
        NAME: "&6&lFILTER BY PLAYER"
        LORE:
          - "&8Current: &f{query}"
          - ""
          - "&e▶ Click to search history"
      PREVIOUS:
        MATERIAL: ARROW
        NAME: "&6&lPREVIOUS PAGE"
        LORE: [ ]
      NEXT:
        MATERIAL: ARROW
        NAME: "&6&lNEXT PAGE"
        LORE: [ ]
      BACK:
        MATERIAL: BARRIER
        NAME: "&c&lBACK"
        LORE: [ ]
