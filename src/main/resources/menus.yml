# =====================================================
#              HavocAuction - menus.yml
# =====================================================
# Menus are drawn as pictures. STRUCTURE is one line per row, one character per slot,
# and CHARS says what each character means.
#
#   "."  content, the repeating area
#   "<"  previous page    ">"  next page
#
# Every other character names a button under ITEMS. There are no filler panes: empty
# slots stay empty, which reads cleaner than a wall of glass.

LINES:
  SEPARATOR: "&8&m                         "
  DURABILITY: "&a| &f{durability} &8({durability_percent}%)"
  RENAMED: "&c| &7Renamed. Actually a &f{type}"
  RENAMED-TAG: " &8({type})"

NAMES:
  SORT:
    RECENTLY-LISTED: "Newest to oldest"
    OLDEST-LISTED: "Oldest to newest"
    LOWEST-PRICE: "Cheapest to priciest"
    HIGHEST-PRICE: "Priciest to cheapest"
    BEST-UNIT-PRICE: "Best price per item"
    ENDING-SOON: "Ending soonest"
  FILTER:
    ALL: "All items"
    BLOCKS: "Blocks"
    TOOLS: "Tools"
    FOOD: "Food"
    COMBAT: "Combat"
    POTIONS: "Potions"
    BOOKS: "Books"
    INGREDIENTS: "Ingredients"
    UTILITIES: "Other"

FILLER:
  MATERIAL: AIR
  NAME: " "

MENUS:

  AUCTION:
    TITLE: "&8▷ Auction House &8| &8({page}/{pages})"
    FILL: false
    STRUCTURE:
      - ". . . . . . . . ."
      - ". . . . . . . . ."
      - ". . . . . . . . ."
      - ". . . . . . . . ."
      - ". . . . . . . . ."
      - "< o f s _ Y i c >"
    CHARS:
      CONTENT: "."
      PREVIOUS: "<"
      NEXT: ">"
      SORT: "o"
      FILTER: "f"
      SEARCH: "s"
      MY-LISTINGS: "Y"
      INFO: "i"
      CLOSE: "c"
    EMPTY: "&7Nothing matches those filters."
    BODY:
      - "&8Description"
      - ""
      - "&6&lInformation:"
      - "&fEverything players have listed"
      - "&ffor sale right now."
      - ""
      - "&6&lThis Page:"
      - "&a| &f{results} &7listings"
      - "&a| &fpage {page}&7/&f{pages}"
      - "&a| &a${balance} &7balance"
    ITEMS:
      INFO:
        MATERIAL: NETHER_STAR
        NAME: "&6&lAUCTION HOUSE"
      LISTING:
        NAME: "&6&l{amount}x {item}{renamed_tag}"
        LORE:
          - "&8{seller}"
          - "{renamed_line}"
          - ""
          - "&6&lInformation:"
          - "&fA &f{type}&f, listed for sale."
          - ""
          - "&6&lPrice:"
          - "&a| &a${price} &7total"
          - "&a| &a${unit_price} &7each"
          - "{durability_line}"
          - "&a| &7{expires} &7remaining"
          - ""
          - "&e▶ Click to purchase"
      OWN-LISTING:
        NAME: "&a&l{amount}x {item}{renamed_tag}"
        LORE:
          - "&8Your listing"
          - "{renamed_line}"
          - ""
          - "&6&lPrice:"
          - "&a| &a${price} &7total"
          - "&a| &a${unit_price} &7each"
          - "{durability_line}"
          - "&a| &7{expires} &7remaining"
          - ""
          - "&e▶ Click to manage"
      SORT:
        MATERIAL: HOPPER
        NAME: "&6&lAUCTION SORTING"
        SELECTED-FORMAT: "&a| &a▶ {option}"
        UNSELECTED-FORMAT: "&c| &7▶ {option}"
        LORE:
          - "&8Description"
          - ""
          - "&6&lInformation:"
          - "&fChange how items are sorted"
          - "&fon the auction house boards"
          - ""
          - "&6&lCurrent Selection:"
          - "{sort_options}"
      FILTER:
        MATERIAL: COMPASS
        NAME: "&6&lCATEGORY FILTER"
        SELECTED-FORMAT: "&a| &a▶ {option}"
        UNSELECTED-FORMAT: "&c| &7▶ {option}"
        LORE:
          - "&8Description"
          - ""
          - "&6&lInformation:"
          - "&fShow only one kind of item"
          - "&fon the auction house boards"
          - ""
          - "&6&lCurrent Selection:"
          - "{filter_options}"
      SEARCH:
        MATERIAL: OAK_SIGN
        NAME: "&6&lSEARCH LISTINGS"
        LORE:
          - "&8Description"
          - ""
          - "&6&lInformation:"
          - "&fFind listings by item, seller"
          - "&for the player who signed a book."
          - ""
          - "&6&lCurrent Selection:"
          - "&a| &f{query}"
          - ""
          - "&e▶ Click to search"
          - "&8Or use /ah <text>"
      MY-LISTINGS:
        MATERIAL: CHEST
        NAME: "&6&lYOUR ACTIVE LISTINGS"
        LORE:
          - "&8Description"
          - ""
          - "&6&lInformation:"
          - "&fItems you have on sale, plus"
          - "&fyour history and settings."
      PREVIOUS:
        MATERIAL: ARROW
        NAME: "&6&lPREVIOUS PAGE"
        LORE: [ "&8Page {previous} of {pages}" ]
      NEXT:
        MATERIAL: ARROW
        NAME: "&6&lNEXT PAGE"
        LORE: [ "&8Page {next} of {pages}" ]
      CLOSE:
        MATERIAL: BARRIER
        NAME: "&c&lCLOSE"
        LORE: [ ]

  SEARCH:
    TITLE: "&8▷ Auction House &8| &8Search"
    FILL: false
    STRUCTURE:
      - "_ _ _ i _ _ _ _ _"
      - "_ _ v _ q _ x _ _"
      - "_ _ _ _ _ _ _ _ _"
    CHARS:
