    CHARS:
      CONTENT: "."
      INFO: "i"
      CONFIRM: "v"
      BACK: "x"
    BODY:
      - "&8Are you sure?"
      - ""
      - "&6&lInformation:"
      - "&fListing &f{amount}x {item}"
      - "&ffor &a${price}&f."
      - ""
      - "&6&lCosts:"
