    CHARS:
      CONTENT: "."
      INFO: "i"
      INPUT: "q"
      PRICE-PER-ITEM: "u"
      CONFIRM: "v"
      BACK: "x"
    BODY:
      - "&8{amount}x {item}"
      - ""
      - "&6&lInformation:"
      - "&fPrice accepts 1k, 2.5m and so on."
      - ""
      - "&6&lCurrent Selection:"
      - "&a| &a${price} &7asking"
      - "&a| &a${unit_price} &7each"
      - "&a| &c${fee} &7listing fee"
      - "&a| &a${payout} &7you receive"
      - "&8After ${tax} tax"
    BODY-EMPTY:
      - "&8Nothing in hand"
      - ""
      - "&6&lInformation:"
      - "&fHold the item you want to sell,"
      - "&fthen reopen this menu."
    PRICE-LABEL: "price"
    ITEMS:
      INFO:
        MATERIAL: EMERALD
        NAME: "&6&lLIST ITEM"
      INPUT:
        MATERIAL: NAME_TAG
        NAME: "&6&lSET PRICE"
        LORE: [ "&e▶ Click, then type in chat" ]
