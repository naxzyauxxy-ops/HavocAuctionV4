      ALERTS:
        MATERIAL: BELL
        NAME: "&6&lSALE ALERTS"
        LORE:
          - "&8Description"
          - ""
          - "&6&lCurrent Selection:"
          - "&a| &f{alerts}"
      FAST-BUY:
        MATERIAL: SUGAR
        NAME: "&6&lFAST MODE"
        LORE:
          - "&8Description"
          - ""
          - "&6&lInformation:"
          - "&fSkip confirmation screens."
          - "&cNo second chances when on."
          - ""
          - "&6&lCurrent Selection:"
          - "&a| &f{fast_buy}"
      PREVIOUS:
        MATERIAL: ARROW
        NAME: "&6&lPREVIOUS PAGE"
        LORE: [ ]
      NEXT:
        MATERIAL: ARROW
        NAME: "&6&lNEXT PAGE"
        LORE: [ ]
      BACK:
        MATERIAL: BARRIER
        NAME: "&c&lBACK"
        LORE: [ ]

  MANAGE-LISTING:
    TITLE: "&8▷ Auction House &8| &8Your Listing"
    FILL: false
    STRUCTURE:
      - "_ _ _ i _ _ _ _ _"
      - "_ _ K _ p _ x _ _"
      - "_ _ _ _ _ _ _ _ _"
    CHARS:
      CONTENT: "."
      INFO: "i"
      CANCEL-LISTING: "K"
      PREVIEW: "p"
      BACK: "x"
    BODY:
      - "&8Your listing"
      - "{renamed_line}"
      - ""
      - "&6&lPrice:"
      - "&a| &a${price} &7total"
      - "&a| &a${unit_price} &7each"
      - "{durability_line}"
      - "&a| &7{expires} &7remaining"
    ITEMS:
      CANCEL-LISTING:
        MATERIAL: RED_DYE
        NAME: "&c&lREMOVE LISTING"
        LORE:
          - "&8Description"
          - ""
          - "&6&lInformation:"
          - "&fTakes it off the board. The item"
          - "&fwaits in your collect menu."
      PREVIEW:
        MATERIAL: SPYGLASS
        NAME: "&6&lINSPECT ITEM"
        LORE: [ ]
      BACK:
        MATERIAL: ARROW
        NAME: "&c&lBACK"
        LORE: [ ]

  SELL:
    TITLE: "&8▷ Auction House &8| &8List Item"
    FILL: false
    STRUCTURE:
      - "_ _ _ i _ _ _ _ _"
      - "_ _ q _ u _ v _ _"
